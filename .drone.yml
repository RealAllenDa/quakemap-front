kind: pipeline
type: docker
name: build

steps:
  - name: docker
    image: plugins/docker
    environment:
      sentry_token:
        from_secret: sentry_token
    settings:
      username:
        from_secret: docker_user
      password:
        from_secret: docker_password
      repo: registry.mightyhub.net/hnfront/quakemap_front
      registry: registry.mightyhub.net
      build_args:
        - environment=staging
      build_args_from_env:
        - sentry_token

---
kind: pipeline
type: exec
name: deploy

platform:
  os: linux
  arch: amd64

clone:
  disable: true

steps:
  - name: deploy
    environment:
      docker_user:
        from_secret: docker_user
      docker_pass:
        from_secret: docker_password
    commands:
      - docker stop quakemap_front || true && docker rm quakemap_front || true
      - docker login --username $${docker_user} --password $${docker_pass} registry.mightyhub.net
      - docker run -d --pull=always --name quakemap_front -p 8787:80 registry.mightyhub.net/hnapi/quakemap_front:latest

depends_on:
  - build
